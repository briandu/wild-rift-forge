<!--
  Product email for pool patch notes and tier-letter shifts.
  Placeholders: {{PREVIEW}} {{BADGE}} {{EYEBROW}} {{TITLE}} {{LEDE}}
  {{SECTION}} {{COUNT}} {{ROWS}} {{CTA_HREF}} {{CTA_LABEL}} {{SITE}}
-->
<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wild Rift Forge</title>
<style>
  body,table,td,a{-webkit-text-size-adjust:100%;-ms-text-size-adjust:100%;}
  table,td{mso-table-lspace:0pt;mso-table-rspace:0pt;}
  body{margin:0;padding:0;width:100%!important;}
  a{color:#7FDCFF;}
  @media screen and (max-width:600px){
    .c{width:100%!important;}
    .p{padding-left:22px!important;padding-right:22px!important;}
    .h1{font-size:34px!important;letter-spacing:-1.6px!important;}
  }
</style>
</head>
<body style="margin:0;padding:0;background-color:#0B0A12;">
<div style="display:none;max-height:0;overflow:hidden;mso-hide:all;font-size:1px;line-height:1px;color:#0B0A12;">{{PREVIEW}}</div>
<center style="width:100%;background-color:#0B0A12;">
<table role="presentation" class="c" width="600" align="center" cellpadding="0" cellspacing="0" border="0" style="width:600px;max-width:600px;margin:0 auto;">
  <tr><td class="p" style="padding:28px 36px 18px 36px;" align="left">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0"><tr>
      <td valign="middle">
        <img src="https://hplpzzeeibvhpgahddeu.supabase.co/storage/v1/object/public/game-assets/brand/logo-wr-forge-email.png" width="168" height="74" alt="Wild Rift Forge" style="display:block;width:168px;height:74px;border:0;">
      </td>
      <td align="right" valign="middle">
        <table role="presentation" cellpadding="0" cellspacing="0" border="0" align="right"><tr>
          <td bgcolor="#17151F" style="background-color:#17151F;border:1px solid #2A2736;border-radius:20px;padding:7px 13px;font-family:Arial,Helvetica,sans-serif;font-size:12px;font-weight:bold;color:#9FCBE4;white-space:nowrap;">{{BADGE}}</td>
        </tr></table>
      </td>
    </tr></table>
  </td></tr>
  <tr><td bgcolor="#101C27" style="background-color:#101C27;padding:0;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
      <tr><td class="p" style="padding:44px 36px 0 36px;" align="left">
        <div style="font-family:Arial,Helvetica,sans-serif;font-size:11.5px;font-weight:bold;letter-spacing:2.4px;color:#7FDCFF;">{{EYEBROW}}</div>
        <div class="h1" style="padding-top:15px;font-family:'Arial Black','Arial Bold',Gadget,Arial,Helvetica,sans-serif;font-size:40px;line-height:0.98;font-weight:900;letter-spacing:-2px;color:#FFFFFF;">{{TITLE}}</div>
        <div style="padding-top:16px;font-family:Arial,Helvetica,sans-serif;font-size:15.5px;line-height:1.62;color:#9BAFBF;">{{LEDE}}</div>
      </td></tr>
      <tr><td class="p" style="padding:26px 36px 40px 36px;" align="left">
        <table role="presentation" cellpadding="0" cellspacing="0" border="0"><tr>
          <td bgcolor="#0E8FD1" style="background-color:#0E8FD1;border-radius:12px;">
            <a href="{{CTA_HREF}}" target="_blank" style="display:block;padding:16px 30px;font-family:Arial,Helvetica,sans-serif;font-size:15px;font-weight:bold;color:#FFFFFF;text-decoration:none;">{{CTA_LABEL}}</a>
          </td>
        </tr></table>
      </td></tr>
    </table>
  </td></tr>
  <tr><td bgcolor="#0B141C" style="background-color:#0B141C;height:14px;line-height:14px;font-size:1px;">&nbsp;</td></tr>
  <tr><td bgcolor="#16C0FF" style="background-color:#16C0FF;height:2px;line-height:2px;font-size:1px;">&nbsp;</td></tr>
  <tr><td class="p" style="padding:38px 36px 0 36px;" align="left">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0"><tr>
      <td style="font-family:Arial,Helvetica,sans-serif;font-size:11.5px;font-weight:bold;letter-spacing:2.2px;color:#9FCBE4;">{{SECTION}}</td>
      <td align="right" style="font-family:Arial,Helvetica,sans-serif;font-size:11.5px;font-weight:bold;letter-spacing:1.4px;color:#8B87A8;">{{COUNT}}</td>
    </tr></table>
  </td></tr>
  <tr><td class="p" style="padding:14px 36px 0 36px;" align="left">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
      {{ROWS}}
    </table>
  </td></tr>
  <tr><td class="p" style="padding:30px 36px 44px 36px;" align="left">
    <div style="border-top:1px solid #1A1826;padding-top:20px;font-family:Arial,Helvetica,sans-serif;font-size:12px;line-height:1.75;color:#8B87A8;">
      You get this because this alert is on for your champion pool.
      <a href="{{SITE}}/me?tab=notifications" style="color:#8B87A8;text-decoration:underline;">Email preferences</a>.
    </div>
  </td></tr>
</table>
</center>
</body>
</html>
