name: Sync champion stats

on:
  schedule:
    # Daily, offset from the hour so it is less likely to be dropped.
    - cron: '41 7 * * *'
  workflow_dispatch:

concurrency:
  group: stats-sync
  cancel-in-progress: false

jobs:
  sync-stats:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Ingest Tencent CN stats and recompute tiers
        run: npm run scrape:stats
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}

      - name: Email tier shift alerts
        run: node scripts/send-account-alerts.mjs --kind=tier
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          SITE_URL: https://wildriftforge.com
