name: Check for patch updates

on:
  schedule:
    # Every 6 hours. Offset from the top of the hour because GitHub delays
    # (or drops) crons scheduled at :00 during peak load.
    - cron: '17 */6 * * *'
  # Allow manual runs from the Actions tab.
  workflow_dispatch:

# Never run two checks at once; a delayed run just waits for the previous one.
concurrency:
  group: patch-check
  cancel-in-progress: false

jobs:
  check-latest-patch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # process.loadEnvFile (used by the scraper) requires Node >= 20.12
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check latest patch and ingest if new
        id: patch
        run: |
          set -o pipefail
          npm run scrape:latest | tee scrape-latest.log
          if grep -q '^WRF_PATCH_INSERTED=true$' scrape-latest.log; then
            echo "inserted=true" >> "$GITHUB_OUTPUT"
          else
            echo "inserted=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}

      - name: Analyze new patch
        if: steps.patch.outputs.inserted == 'true'
        run: npm run scrape:analyze-patch
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

      - name: Email pool patch alerts
        if: steps.patch.outputs.inserted == 'true'
        run: node scripts/send-account-alerts.mjs --kind=pool
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          SITE_URL: https://wildriftforge.com
